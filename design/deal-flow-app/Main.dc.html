<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1e1a16; text-decoration: underline; text-underline-offset: 2px; }
    a:hover { color: #4a443c; }
    .dfa { -webkit-font-smoothing: antialiased; }
    .dfa-scroll::-webkit-scrollbar { display: none; }
  </style>
</helmet>
<div class="dfa" style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #f6f2ea; color: #1e1a16; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;">

  <div style="height: 59px; flex-shrink: 0;"></div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 16px 20px; flex-shrink: 0;">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-family: 'Newsreader', Georgia, serif; font-size: 30px; line-height: 34px; font-weight: 500; letter-spacing: -0.01em;">Deal Flow</div>
        <div style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #857c71;">Week of 1 Sep &middot; Live book</div>
      </div>
      <div style="width: 44px; height: 44px; margin: -6px -10px 0 0; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1e1a16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="6.5"></circle>
          <path d="M15.8 15.8 L20 20"></path>
        </svg>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: #e3dccf; border-top: 1px solid #e3dccf; border-bottom: 1px solid #e3dccf;">
      <div style="display: flex; flex-direction: column; gap: 3px; padding: 12px 0 12px 0; background: #f6f2ea;">
        <div style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 22px; line-height: 24px; font-weight: 500;">12</div>
        <div style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: #857c71;">Active</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px; padding: 12px 0 12px 12px; background: #f6f2ea;">
        <div style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 22px; line-height: 24px; font-weight: 500; color: #a63c28;">3</div>
        <div style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: #857c71;">Off track</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px; padding: 12px 0 12px 12px; background: #f6f2ea;">
        <div style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 22px; line-height: 24px; font-weight: 500;">5.2<span style="font-size: 13px;">B</span></div>
        <div style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: #857c71;">Pipeline EV</div>
      </div>
    </div>
  </div>

  <div class="dfa-scroll" style="display: flex; gap: 8px; padding: 0 20px 10px 20px; overflow-x: auto; flex-shrink: 0; scrollbar-width: none;">
    <sc-for list="{{chips}}" as="chip" hint-placeholder-count="6">
      <div onClick="{{ chip.pick }}" style="flex-shrink: 0; height: 44px; display: flex; align-items: center; cursor: pointer; user-select: none;">
        <div style="height: 32px; display: flex; align-items: center; padding: 0 13px; border-radius: 16px; border: 1px solid {{chip.border}}; background: {{chip.bg}}; color: {{chip.fg}}; font-size: 13px; font-weight: 450;">{{chip.label}}</div>
      </div>
    </sc-for>
  </div>

  <div class="dfa-scroll" style="flex: 1 1 auto; overflow-y: auto; padding: 0 20px 20px 20px; display: flex; flex-direction: column; gap: {{gap}}px; scrollbar-width: none;">
    <sc-for list="{{deals}}" as="deal" hint-placeholder-count="8">
      <div style="display: flex; background: #fffdf8; border: 1px solid #e3dccf; border-radius: 3px; overflow: hidden;">
        <div style="width: 3px; flex-shrink: 0; background: {{deal.tone}};"></div>
        <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 10px; padding: {{pad}}px 14px;">

          <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px;">
            <div style="font-family: 'Newsreader', Georgia, serif; font-size: 19px; line-height: 22px; font-weight: 500;">{{deal.name}}</div>
            <div style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; font-weight: 500; flex-shrink: 0;">{{deal.ev}}</div>
          </div>

          <div style="display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #4a443c; min-width: 0;">
            <div style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{deal.client}}</div>
            <div style="width: 3px; height: 3px; border-radius: 50%; background: #c8bfae; flex-shrink: 0;"></div>
            <div style="flex-shrink: 0; color: #857c71;">{{deal.type}}</div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 7px;">
            <div style="display: flex; gap: 3px;">
              <sc-for list="{{deal.ticks}}" as="tick" hint-placeholder-count="8">
                <div style="height: 3px; flex: 1 1 0; background: {{tick.bg}};"></div>
              </sc-for>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
              <div style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: #1e1a16;">{{deal.stage}}</div>
              <div style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: {{deal.tone}};">{{deal.flag}}</div>
            </div>
          </div>

          <div style="display: flex; align-items: center; gap: 8px; padding-top: 9px; border-top: 1px solid #efe9dd;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#857c71" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
              <circle cx="12" cy="12" r="8.5"></circle>
              <path d="M12 7.5 V12 L15 14"></path>
            </svg>
            <div style="font-size: 12.5px; color: #4a443c; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{deal.next}}</div>
            <div style="margin-left: auto; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: {{deal.dueTone}}; flex-shrink: 0;">{{deal.due}}</div>
          </div>

        </div>
      </div>
    </sc-for>

    <div style="padding: 6px 0 2px 0; text-align: center; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #a79d90;">{{footer}}</div>
  </div>

  <div style="flex-shrink: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #e3dccf; background: #f6f2ea; padding: 8px 8px 26px 8px;">
    <div style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #1e1a16;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M4 18 V9"></path><path d="M10 18 V5"></path><path d="M16 18 V12"></path><path d="M22 18 V7"></path>
      </svg>
      <div style="font-size: 10px; font-weight: 500; letter-spacing: 0.01em;">Pipeline</div>
    </div>
    <div style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #a79d90;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 3 H15 L19 7 V21 H6 Z"></path><path d="M9 12 H15"></path><path d="M9 16 H13"></path>
      </svg>
      <div style="font-size: 10px; letter-spacing: 0.01em;">Screening</div>
    </div>
    <div style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #a79d90;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7 L6 9 L9.5 5.5"></path><path d="M13 7.5 H20"></path>
        <path d="M4 16 L6 18 L9.5 14.5"></path><path d="M13 16.5 H20"></path>
      </svg>
      <div style="font-size: 10px; letter-spacing: 0.01em;">Actions</div>
    </div>
    <div style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #a79d90;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.5"></circle><path d="M12 3.5 V12 H20.5"></path>
      </svg>
      <div style="font-size: 10px; letter-spacing: 0.01em;">Portfolio</div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"compact":{"editor":"boolean","default":false,"section":"Layout"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'All' };
  }

  stages() {
    return ['Pre-mandate', 'Engaged', 'Marketing', 'IOI', 'Diligence', 'Final bids', 'Signing', 'Close'];
  }

  book() {
    return [
      { name: 'Project Meridian', client: 'Halcyon Industrial Services', type: 'Sell-side', ev: '$840M', stage: 'Final bids', flag: 'On track', tone: '#2f6b4a', next: 'Final bids due', due: '12 Sep' },
      { name: 'Project Kestrel', client: 'Vantage Facilities Group', type: 'Sell-side', ev: '$265M', stage: 'Marketing', flag: 'Delayed', tone: '#a63c28', next: 'CIM distribution slipped', due: '29 Aug' },
      { name: 'Project Halyard', client: 'Ardent Diagnostics', type: 'Sell-side', ev: '$310M', stage: 'Diligence', flag: 'At risk', tone: '#96650f', next: 'Mgmt meetings unconfirmed', due: '08 Sep' },
      { name: 'Project Foxglove', client: 'Northwind Logistics', type: 'Buy-side', ev: '$1.2B', stage: 'IOI', flag: 'On track', tone: '#2f6b4a', next: 'IOIs in, 6 of 9', due: '04 Sep' },
      { name: 'Project Alder', client: 'Brightpath Software', type: 'Sell-side', ev: '$520M', stage: 'Signing', flag: 'On track', tone: '#2f6b4a', next: 'SPA markup circulated', due: '15 Sep' },
      { name: 'Project Cinder', client: 'Rowan Specialty Chemicals', type: 'Carve-out', ev: '$190M', stage: 'Engaged', flag: 'On track', tone: '#2f6b4a', next: 'Buyer list approval', due: '10 Sep' },
      { name: 'Project Thornbury', client: 'Latham Fluid Systems', type: 'Sell-side', ev: '$430M', stage: 'Diligence', flag: 'On track', tone: '#2f6b4a', next: 'Site visits scheduled', due: '19 Sep' },
      { name: 'Project Selkirk', client: 'Corvid Instruments', type: 'Buy-side', ev: '$275M', stage: 'Diligence', flag: 'On track', tone: '#2f6b4a', next: 'QoE kickoff with Alvarez', due: '22 Sep' }
    ];
  }

  renderVals() {
    const compact = this.props.compact ?? false;
    const stages = this.stages();
    const active = this.state.filter;
    const labels = ['All', 'Marketing', 'IOI', 'Diligence', 'Final bids', 'Signing'];

    const chips = labels.map((label) => {
      const on = label === active;
      return {
        label: label,
        bg: on ? '#1e1a16' : '#fffdf8',
        fg: on ? '#f6f2ea' : '#4a443c',
        border: on ? '#1e1a16' : '#e3dccf',
        pick: () => this.setState({ filter: label })
      };
    });

    const deals = this.book()
      .filter((d) => active === 'All' || d.stage === active)
      .map((d) => {
        const at = stages.indexOf(d.stage);
        return Object.assign({}, d, {
          ticks: stages.map((s, i) => ({ bg: i <= at ? '#1e1a16' : '#e3dccf' })),
          dueTone: d.tone === '#2f6b4a' ? '#857c71' : d.tone
        });
      });

    const footer = active === 'All'
      ? deals.length + ' of 12 mandates shown'
      : deals.length + ' in ' + active;

    return {
      chips: chips,
      deals: deals,
      footer: footer,
      gap: compact ? 8 : 12,
      pad: compact ? 11 : 14
    };
  }
}
</script>
</body>
</html>
