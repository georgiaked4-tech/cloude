[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-research-agent"
version = "0.1.0"
description = "Read-only crypto research, deterministic signals and paper trading"
requires-python = ">=3.11"
dependencies = [
  "ccxt>=4.4,<5",
  "pandas>=2.2,<3",
  "numpy>=2,<3",
  "aiogram>=3.13,<4",
  "anthropic>=0.40,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pyyaml>=6,<7",
  "structlog>=24,<26",
  "feedparser>=6,<7",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

