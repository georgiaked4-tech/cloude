[project]
name = "crypto-research-agent"
version = "0.1.0"
description = "Research and paper-signal agent for crypto markets (stages 1-2, no live trading)"
requires-python = ">=3.11"
dependencies = [
    "ccxt",
    "pandas",
    "numpy",
    "aiogram",
    "anthropic",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "structlog",
    "feedparser",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
