exchange:
  name: bybit
  timeout_ms: 10000
  max_retries: 3
  retry_base_seconds: 0.5

trading:
  symbols: ["BTC/USDT"]
  timeframe: "1h"
  initial_balance: "10000"
  taker_fee_pct: "0.055"
  slippage_pct: "0.05"

strategy:
  fast_ema: 12
  slow_ema: 26

risk:
  max_position_pct: "2"
  max_open_positions: 3
  daily_loss_limit_pct: "3"
  stop_loss_pct: "2"
  take_profit_pct: "4"

storage:
  database_path: "data/agent.db"

logging:
  level: "INFO"

news:
  feeds:
    - "https://www.coindesk.com/arc/outboundfeeds/rss/"
  request_timeout_seconds: 10
  # Новость сохраняется, если её заголовок или описание содержит хотя бы
  # min_relevance ключевых слов из списка. Регистр не учитывается.
  min_relevance: 1
  keywords:
    - "bitcoin"
    - "btc"
    - "ethereum"
    - "eth"
    - "sec"
    - "etf"
    - "regulation"
    - "exchange"
    - "stablecoin"

research:
  model: "claude-sonnet-5"
  max_tokens: 1200
  max_news_items: 50

